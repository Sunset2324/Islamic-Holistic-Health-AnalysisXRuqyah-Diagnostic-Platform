# Header keamanan untuk frontend statis. DISERTAKAN (include) di setiap location yang memakai add_header,
# karena nginx membuang add_header tingkat server bila sebuah location punya add_header sendiri.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Kamera/mikrofon/lokasi dimatikan sekarang. Longgarkan hanya saat fitur foto lidah/suara dibuat.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# style-src tanpa 'unsafe-inline': React mengatur style lewat DOM (tidak diblokir CSP); diuji di verify-nginx.sh.
# Bila nanti ada pustaka yang menyuntik <style>/atribut style dari HTML, uji ulang sebelum melonggarkan.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
