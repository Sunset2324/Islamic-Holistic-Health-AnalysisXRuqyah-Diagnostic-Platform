# Ganti __DOMAIN__ dengan domainmu (sed -i 's/__DOMAIN__/contoh.id/g'). Lokasi berkas lihat docs/DEPLOY-VPS.md.
# Urutan: (1) pasang konfigurasi ini dengan blok HTTPS dikomentari, (2) ambil sertifikat dengan certbot --webroot,
# (3) aktifkan blok HTTPS. Sertifikat diperbarui otomatis oleh timer certbot.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # 'http2' di baris listen dipakai agar jalan di nginx 1.24 (Ubuntu 24.04). Di nginx >= 1.25.1 gaya ini hanya memberi
    # peringatan 'deprecated'; ganti ke direktif terpisah `http2 on;` bila sudah memakai versi itu.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /var/www/myherbalis;
    index index.html;

    # Batas badan sama dengan bodyLimit server (128 KB). Unggah foto nanti butuh batas sendiri.
    client_max_body_size 128k;

    # API: diteruskan ke Node di localhost. X-Forwarded-For DIISI ULANG (bukan ditambah) agar klien tidak bisa memalsukan IP.
    location /api/ {
        limit_req zone=myherbalis_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        # Header keamanan dan Cache-Control: no-store sudah dikirim oleh aplikasi; di sini hanya HSTS.
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Aset ber-hash dari Vite: aman di-cache lama.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/myherbalis-headers.conf;
    }

    # Halaman aplikasi (SPA): jangan di-cache agar pembaruan langsung terlihat.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/myherbalis-headers.conf;
    }

    # Jangan layani berkas tersembunyi.
    location ~ /\. { deny all; return 404; }
}
