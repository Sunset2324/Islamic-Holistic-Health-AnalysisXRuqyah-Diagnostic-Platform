# Dipasang di /etc/nginx/conf.d/ (konteks http). Dimuat lebih dulu karena namanya berawalan 00.
server_tokens off;

# Batas laju tambahan di depan API (aplikasi punya batas sendiri per endpoint). 10 permintaan/detik per IP.
limit_req_zone $binary_remote_addr zone=myherbalis_api:10m rate=10r/s;
limit_req_status 429;
